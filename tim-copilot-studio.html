<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Agente de Reincidência e Contexto (NOI) TIM · Microsoft Copilot Studio</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit}
:root{--bg:#f5f5f5;--card:#fff;--line:#e1e1e1;--line2:#ededed;--t1:#242424;--t2:#424242;--t3:#616161;--t4:#8a8a8a;--brand:#0f6cbd;--brand2:#115ea3;--ok:#107c10;--tim:#e4002b;--timb:#004c97}
html,body{background:var(--bg);color:var(--t1);font-family:"Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.cs{display:grid;grid-template-rows:48px minmax(0,1fr);height:100vh;min-width:1180px}
.grow{flex:1}
.muted{color:var(--t4)}
code,.mono{font-family:"Cascadia Code","SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

.topbar{display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;width:400px;font-size:15px}
.brand b{font-weight:600}
.search{display:flex;align-items:center;gap:8px;width:320px;height:30px;padding:0 10px;background:#f0f0f0;border-radius:4px;color:var(--t3)}
.search input{border:0;background:transparent;outline:none;flex:1;font-size:13px}
.tr{margin-left:auto;display:flex;align-items:center;gap:8px}
.env{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);margin-right:10px}
.env i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.ic{width:32px;height:32px;border:0;background:transparent;border-radius:4px;display:grid;place-items:center;color:var(--t2);font-size:18px}
.ic:hover{background:#f0f0f0}
.me{width:30px;height:30px;border-radius:50%;background:#5b2a86;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}

.body{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:0}
.lnav{background:#fafafa;border-right:1px solid var(--line);padding-top:8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lnav .li{width:50px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;font-size:10px;color:var(--t3);border-radius:6px}
.lnav .li.on{background:#ebf3fc;color:var(--brand)}
.page{overflow-y:auto;padding:14px 24px 60px;min-width:0}
.crumbs{font-size:13px;color:var(--t3)}
.crumbs span{margin:0 6px;color:var(--t4)}
.crumbs b{color:var(--t1);font-weight:600}
.phead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px}
.pid{display:flex;align-items:center;gap:12px}
.pid h1{font-size:20px;font-weight:600;margin:0}
.av{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;flex:none}
.av img{width:26px}
.av.lg{width:48px;height:48px}
.av.lg img{width:34px}
.pub{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ok);background:#f1faf1;border:1px solid #9fd89f;border-radius:999px;padding:2px 10px}
.pub i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pact{display:flex;gap:10px}
.btn{height:32px;padding:0 14px;border:1px solid #d1d1d1;background:#fff;border-radius:4px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;color:var(--t1)}
.btn:hover:not(:disabled){background:#f5f5f5}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--brand2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:28px;padding:0 11px;font-size:13px}
.lnk{border:0;background:transparent;color:var(--brand);font-weight:600;font-size:13px;padding:0;margin-left:8px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -24px 18px;padding:0 24px}
.ptabs button{display:inline-flex;align-items:center;gap:7px;border:0;background:transparent;padding:10px 12px;font-size:14px;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--brand);font-weight:600;border-bottom-color:var(--brand)}
.ptabs button:hover:not(.on){color:var(--t1)}

.card{background:var(--card);border:1px solid var(--line2);border-radius:8px;padding:18px 20px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card+.card{margin-top:16px}
.card.wide{max-width:1240px}
.sh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.sh h3{margin:0;font-size:16px;font-weight:600}
.sh p{margin:3px 0 0;font-size:13px;color:var(--t3)}
.sh .row{display:flex;gap:10px;align-items:center;font-size:12.5px}

.ov{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start;max-width:1400px}
.idc{display:flex;justify-content:space-between;gap:20px}
.idl{display:flex;gap:16px}
.idl h2{margin:0 0 4px;font-size:16.5px;font-weight:600}
.idl p{margin:0 0 10px;font-size:13.5px;color:var(--t2);line-height:1.5;max-width:720px}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tags span{font-size:12.5px;background:#f5f5f5;border:1px solid var(--line);border-radius:4px;padding:2px 8px;color:var(--t2)}
.tags b{font-weight:600;margin-right:4px;color:var(--t1)}
.clogo{height:26px;align-self:flex-start}
.instr{background:#fafafa;border:1px solid var(--line);border-radius:6px;padding:14px 18px;font-family:"Cascadia Code","SF Mono",ui-monospace,Menlo,monospace;font-size:12.8px;line-height:1.75;color:var(--t1);outline:none}
.instr h4{color:#b0001f;font-size:12.8px;margin:14px 0 2px;font-weight:700}
.instr p{margin:0}
.instr.short{max-height:230px;overflow:hidden;position:relative}
.instr .more{position:absolute;left:0;right:0;bottom:0;padding:30px 0 10px;border:0;background:linear-gradient(transparent,#fafafa 55%);color:var(--brand);font:600 13px "Segoe UI",Inter,sans-serif}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--t3)}
.refs code{font-size:11.5px;background:#ebf3fc;color:var(--brand);border-radius:4px;padding:2px 6px}

.card .src{display:grid;grid-template-columns:96px 1fr auto auto auto auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-top:10px}
.sl{height:40px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;background:#fff}
.cw{height:18px}
.cw.sm{height:13px}
.sm b{font-size:14.5px;font-weight:600}
.kind{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--brand);background:#ebf3fc;border-radius:3px;padding:1px 6px;margin-left:8px}
.sm p{margin:2px 0 0;font-size:13px;color:var(--t3)}
.conn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ok);background:#f1faf1;border:1px solid #c4e7c4;border-radius:999px;padding:1px 9px}
.conn i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.conn.off{color:var(--t3);background:#f5f5f5;border-color:var(--line)}
.conn.off i{background:var(--t4)}
.cnt{font-size:13px;color:var(--t3);white-space:nowrap}
.tg{width:40px;height:20px;border-radius:999px;border:1px solid #8a8a8a;background:#fff;position:relative;padding:0;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:12px;height:12px;border-radius:50%;background:#616161;transition:left 140ms ease}
.tg.on{background:var(--ok);border-color:var(--ok)}
.tg.on i{left:23px;background:#fff}
.kn{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
.kn:first-of-type{border-top:0}
.kn span{color:var(--t3);font-size:12.5px}

.comps{position:sticky;top:0;padding:16px 12px}
.comps h4{margin:0 8px 10px;font-size:12px;letter-spacing:.06em;color:var(--t3);font-weight:600}
.comp{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:10px;border:1px solid transparent;background:transparent;border-radius:6px;padding:8px;text-align:left}
.comp:hover{background:#f5f5f5}
.comp .ci{width:30px;height:30px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;color:var(--t2)}
.comp b{display:block;font-size:14px;font-weight:600}
.comp i{font-style:normal;font-size:12.5px;color:var(--t3)}
.comp em{font-style:normal;font-size:12px;font-weight:600;background:#f0f0f0;border-radius:999px;padding:0 8px}
.comps .sep{height:1px;background:var(--line2);margin:10px 8px}
.arch{margin:0 8px;font-size:12.5px;color:var(--t3);line-height:1.5}

.server{border:1px solid var(--line);border-radius:8px;margin-top:12px;overflow:hidden}
.srh{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#fff}
.srh b{font-size:14.5px}
.srh .cnt{margin-left:4px}
.srmeta{display:grid;grid-template-columns:repeat(4,auto);gap:24px;justify-content:start;padding:10px 16px;background:#fafafa;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.srmeta span{display:block;font-size:10.5px;letter-spacing:.05em;color:var(--t3);font-weight:600;margin-bottom:2px}
.srmeta code{font-size:12px;font-weight:600}
.trow{border-top:1px solid var(--line2)}
.trow:first-of-type{border-top:0}
.trow.dis{opacity:.55}
.th{width:100%;display:grid;grid-template-columns:30px 1fr auto 20px;gap:12px;align-items:start;border:0;background:transparent;padding:12px 16px;text-align:left}
.th:hover{background:#fafafa}
.ti{width:28px;height:28px;border-radius:6px;background:#ebf3fc;color:var(--brand);display:grid;place-items:center}
.tm code{font-weight:700;font-size:13px}
.tm p{margin:3px 0 0;font-size:13px;color:var(--t2)}
.tm p i{color:var(--t3);font-style:normal}
.acc{font-size:11.5px;font-weight:600;background:#f0f0f0;color:var(--t2);border-radius:4px;padding:1px 7px;white-space:nowrap}
.acc.a{background:#ebf3fc;color:var(--brand)}
.td{padding:0 16px 16px 58px}
.tdg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.td h5{margin:0 0 6px;font-size:11.5px;letter-spacing:.04em;color:var(--t3);text-transform:uppercase;font-weight:600}
pre.cfg{margin:0;background:#fafafa;border:1px solid var(--line);border-radius:6px;padding:10px 12px;font-size:11.8px;line-height:1.55;overflow:auto;max-height:220px}
.tdo{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:13px}
.tdo label{display:inline-flex;align-items:center;gap:8px}
.tdo .ro{font-size:12px;color:var(--ok);background:#f1faf1;border-radius:4px;padding:2px 8px}

.json{position:relative}
.json pre{margin:0;background:#0f1117;color:#c9d1e3;border-radius:9px;padding:12px 14px;font-size:11.5px;line-height:1.55;overflow:auto;white-space:pre;max-height:var(--mh,300px);font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
.json .jk{color:#8ab4ff}.json .js{color:#a5e3a1}.json .jn{color:#f5b97a}.json .jl{color:#e599f7}
.jcopy{position:absolute;top:8px;right:8px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#c9d1e3;font-size:11px;border-radius:6px;padding:2px 8px}
.jcopy:hover{background:rgba(255,255,255,.12)}

.test{max-width:1400px}
.chatwrap{display:grid;grid-template-columns:minmax(560px,760px) minmax(340px,1fr);gap:16px;justify-content:center;align-items:start}
.chat{background:#fff;border:1px solid var(--line2);border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:grid;grid-template-rows:52px minmax(0,1fr) 64px;height:calc(100vh - 262px);min-height:520px}
.chat header{display:flex;align-items:center;gap:10px;padding:0 12px 0 16px;border-bottom:1px solid var(--line2);font-size:14.5px}
.chat .msgs{overflow-y:auto;padding:16px 16px 8px;background:#fafafa}
.bmsg{display:flex;gap:10px;margin-bottom:14px;animation:fade 220ms ease}
.bmsg>img{margin-top:4px;flex:none;width:22px;height:22px}
.bb{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:13.8px;line-height:1.55;color:var(--t1);max-width:680px;min-width:0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.bb p{margin:0 0 8px}
.bb p:last-child{margin-bottom:0}
.bb code{font-size:12px;background:#f5f5f5;padding:0 4px;border-radius:3px}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.umsg{margin:0 0 14px auto;max-width:440px;background:#ebf3fc;border:1px solid #cfe4fa;border-radius:8px;padding:10px 14px;font-size:13.8px;animation:fade 220ms ease}
.sugg{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:10px}
.sugg button{border:1px solid #b4d6fa;background:#fff;color:var(--brand);border-radius:999px;padding:4px 12px;font-size:13px;text-align:left}
.sugg button:hover{background:#ebf3fc}
.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--t3);font-size:13px}
.dots{display:inline-flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--brand);animation:bounce 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,80%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.activity{border:1px solid var(--line);border-radius:6px;margin:10px 0 0}
.activity.first{margin-top:0}
.ans{margin-top:12px}
.activity .ah{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:8px 10px;font-size:13px;font-weight:600;color:var(--t2)}
.activity .ah svg:last-child{margin-left:auto}
.activity ol{list-style:none;margin:0;padding:0 10px 8px}
.activity li{border-top:1px solid var(--line2);padding:6px 0}
.activity li button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;text-align:left;font-size:12.5px}
.activity li button:hover code{color:var(--brand);text-decoration:underline}
.activity .ok{color:var(--ok);font-weight:700}
.activity .srcb{font-size:11px;color:var(--t3);background:#f5f5f5;border-radius:3px;padding:0 5px;white-space:nowrap}
.activity .ms{margin-left:auto;font-size:11.5px;color:var(--t4)}
.activity li p{margin:3px 0 0 18px;font-size:12px;color:var(--t3)}

/* answer blocks */
.ans h5{margin:14px 0 4px;font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--t3);text-transform:uppercase}
.ans ul{margin:0 0 4px;padding-left:18px}
.ans li{margin:3px 0}
.hl{font-size:14.5px}
.demo-note{display:flex;gap:8px;align-items:flex-start;background:#fff4ce;border:1px solid #f2d27a;color:#6b4300;border-radius:6px;padding:7px 10px;font-size:12.5px;margin:8px 0 2px}
.demo-note svg{flex:none;margin-top:2px}
.rk{width:100%;border-collapse:collapse;font-size:12.4px;margin:6px 0 2px}
.rk th{text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);font-weight:600;padding:5px 6px;border-bottom:1px solid var(--line)}
.rk td{padding:5px 6px;border-bottom:1px solid var(--line2);white-space:nowrap}
.rk th.r,.rk td.r{text-align:right}
.rk tbody tr:first-child td{background:#fff7f8}
.rk .n{font-variant-numeric:tabular-nums}
.rk .cl{display:inline-block;min-width:18px;text-align:center;font-weight:600;border-radius:3px;background:#f0f0f0;padding:0 4px}
.rk .rate{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end}
.rk .rate b{font-weight:600;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.rk .rate i{width:56px;height:5px;background:#ededed;border-radius:3px;overflow:hidden}
.rk .rate em{display:block;height:100%;background:var(--tim);border-radius:3px}
.rk-foot{font-size:11.5px;color:var(--t4);margin:2px 0 0}
.rec{border:1px solid var(--line);border-left:3px solid var(--tim);border-radius:6px;padding:12px 14px;margin-top:12px;background:#fff9fa}
.rh{font-size:11px;font-weight:700;letter-spacing:.05em;color:#b0001f;text-transform:uppercase}
.rec h4{margin:3px 0 8px;font-size:14.5px}
.rr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-top:1px solid #f5dde1;font-size:12.8px}
.rr span{color:var(--t3);flex:none}
.rr b{font-weight:600;text-align:right}
.why{margin:8px 0;padding-left:18px;font-size:12.8px;color:var(--t2)}
.why li{margin:3px 0}
.conf{font-size:12px;color:var(--t3);font-style:italic;margin:6px 0 0!important}
.next{margin-top:12px!important;font-size:13px;color:var(--t2)}
.next b{color:var(--t1)}

.composer{display:flex;gap:10px;align-items:center;padding:0 14px;border-top:1px solid var(--line2)}
.composer input{flex:1;height:38px;border:1px solid var(--line);border-radius:999px;padding:0 16px;font-size:13.5px;outline:none}
.composer input:focus{border-color:var(--brand)}
.send{width:36px;height:36px;border-radius:50%;border:0;background:var(--brand);color:#fff;display:grid;place-items:center}
.send:disabled{background:#c7c7c7}
.inspect{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:16px 18px;height:calc(100vh - 262px);min-height:520px;overflow-y:auto}
.iempty h4{margin:0 0 6px;font-size:14.5px}
.iempty p{margin:0 0 12px;font-size:13px;color:var(--t3)}
.iempty ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--t4)}
.iempty li{margin:6px 0}
.iempty li.on{color:var(--ok)}
.ci .cih{display:flex;justify-content:space-between;align-items:flex-start}
.ci .k{font-size:11px;font-weight:700;letter-spacing:.05em;color:var(--t3)}
.ci h4{margin:3px 0 4px;font-size:14.5px}
.ci>p{font-size:13px;margin:0 0 10px}
.cit{display:flex;gap:4px;margin-bottom:8px}
.cit button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 11px;font-size:12.5px}
.cit button.on{background:#ebf3fc;border-color:#b4d6fa;color:var(--brand);font-weight:600}
.note{font-size:12.5px;color:var(--t2);background:#fff4ce;border-radius:4px;padding:7px 10px;margin-top:10px}

.eval{max-width:1240px}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dim{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.dt{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--t2)}
.dim>b{display:block;font-size:26px;font-weight:600;margin:8px 0 4px}
.dim>b em{font-style:normal;font-size:13px;color:var(--t3);font-weight:400}
.dim p{margin:0 0 8px;font-size:13px;color:var(--t2)}
.dim .dsrc{font-size:12px;color:var(--t3)}
.evnote{font-size:12.5px;color:var(--t3);margin:10px 2px 14px}
table.et{width:100%;border-collapse:collapse;font-size:13.5px}
.et th{text-align:left;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--t3);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.et th i{display:block;font-style:normal;text-transform:none;letter-spacing:0;color:var(--t4);font-weight:400}
.et td{padding:10px;border-bottom:1px solid var(--line2)}
.et tr{cursor:pointer}
.et tbody tr:hover td{background:#fafafa}
.et tr.on td{background:#ebf3fc}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px}
.st.ok{background:#f1faf1;color:var(--ok)}.st.bad{background:#fdf3f4;color:#c50f1f}.st.warn{background:#fff4ce;color:#8a5300}.st.na{background:#f5f5f5;color:var(--t3)}
.meter{display:inline-flex;align-items:center;gap:8px}
.meter b{font-weight:600;font-variant-numeric:tabular-nums;width:34px}
.meter i{width:90px;height:6px;background:#ededed;border-radius:3px;overflow:hidden}
.meter em{display:block;height:100%;border-radius:3px}
.edetail{margin-top:16px;border-top:1px solid var(--line2);padding-top:14px}
.edetail h4{margin:0 0 10px;font-size:14.5px}
.eg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.eg div{background:#fafafa;border:1px solid var(--line2);border-radius:6px;padding:10px 12px}
.eg span{display:block;font-size:11.5px;letter-spacing:.04em;color:var(--t3);text-transform:uppercase;font-weight:600}
.eg b{display:block;margin:4px 0;font-size:14px}
.eg p{margin:0;font-size:12.8px;color:var(--t2)}
.disc{font-size:12px;color:var(--t4);text-align:center;margin-top:18px}
</style>

  return `<div class="json"><button class="jcopy" data-copy>Copiar</button><pre style="--mh:${mh}px">${body}</pre></div>`;
}

    <section class="chat"><header><img src="${IMG.cop}" alt="" width="22" height="22"><b>Teste seu agente</b><div class="grow"></div><button class="ic" id="rs" title="Iniciar nova sessão de teste" aria-label="Reiniciar conversa">${I.refresh}</button></header>
      <div class="msgs" id="msgs"></div>
      <form class="composer" id="cf"><input id="ci" placeholder="Faça uma pergunta ou descreva uma tarefa" aria-label="Mensagem" autocomplete="off"><button class="send" id="sd" aria-label="Enviar">${I.send}</button></form></section>
    <aside class="inspect" id="insp"></aside></div></div>`;
  const msgs = $("#msgs", c), insp = $("#insp", c), input = $("#ci", c), send = $("#sd", c);
  let busy = false, timers = [], shown = 0, actOpen = true, actEl = null;
  const later = (ms, f) => timers.push(setTimeout(f, ms));
  const bottom = () => msgs.scrollTo({ top: msgs.scrollHeight, behavior: "smooth" });
  const bot = (inner) => { const d = document.createElement("div"); d.className = "bmsg"; d.innerHTML = `<img src="${IMG.cop}" alt=""><div class="bb">${inner}</div>`; msgs.appendChild(d); return d.querySelector(".bb"); };

  function drawInsp(step) {
    if (!step) {
      insp.innerHTML = `<div class="iempty"><h4>Atividade</h4><p>Cada chamada de ferramenta do agente aparece na conversa. Selecione uma para ver a requisição MCP e o resultado estruturado.</p>
        <ol>${CALLS.map((a) => `<li class="${a.step <= shown ? "on" : ""}"><code>${a.tool}</code></li>`).join("")}</ol></div>`;
      return;
    }
    const k = CALLS[step - 1];
    let view = "Resultado";
    const paint = () => {
      insp.innerHTML = `<div class="ci"><div class="cih"><div><span class="k">CELONIS MCP · PASSO ${step}</span><h4><code>${k.tool}</code></h4></div><button class="ic" id="ix" aria-label="Fechar">×</button></div>
        <p class="muted">${esc(k.purpose)}</p>
        <div class="cit">${["Resultado", "Requisição"].map((x) => `<button data-v="${x}" class="${view === x ? "on" : ""}">${x}</button>`).join("")}</div>
        ${jsonHtml(view === "Resultado" ? k.response : k.request, 470)}
        ${step === 3 ? `<p class="note">A PQL é ilustrativa. Na TIM, ela é validada contra o schema real da perspectiva (passo 2).</p>` : ""}</div>`;
      $("#ix", insp).onclick = () => drawInsp(null);
      insp.querySelectorAll("[data-v]").forEach((b) => (b.onclick = () => { view = b.dataset.v; paint(); }));
      insp.querySelector("[data-copy]").onclick = (e) => { navigator.clipboard?.writeText(insp.querySelector("pre").textContent); e.target.textContent = "Copiado"; setTimeout(() => (e.target.textContent = "Copiar"), 1200); };
    };
    paint();
  }
  function drawActivity() {
    if (!actEl) return;
    const calls = CALLS.slice(0, shown);
    actEl.innerHTML = `<button class="ah" data-act>${I.spark} Atividade · ${calls.length} chamada${calls.length > 1 ? "s" : ""} de ferramenta${I.chev(actOpen ? 180 : -90)}</button>
      ${actOpen ? `<ol>${calls.map((k) => `<li><button data-step="${k.step}"><span class="ok">✓</span><span class="srcb">Celonis MCP</span><code>${k.tool}</code><span class="ms">${k.ms} ms</span></button><p>${esc(k.summary)}</p></li>`).join("")}</ol>` : ""}`;
  }
  msgs.addEventListener("click", (e) => {
    const a = e.target.closest("[data-act]"); if (a) { actOpen = !actOpen; return drawActivity(); }
    const s = e.target.closest("[data-step]"); if (s) return drawInsp(+s.dataset.step);
    const p = e.target.closest("[data-prompt]"); if (p) ask();
  });

  function answerHtml() {
    const top = RANK[0];
    const max = rate(top);
    return `<div class="ans">
      <p class="hl"><b>O Site ${top[0]} (${top[1]}/${top[2]}) tem a maior taxa de reincidência de nível 2: ${pct(rate(top))}.</b></p>
      <div class="demo-note">${I.warn}<span>A base é demonstrativa e simulada. Estes números não são resultados reais da TIM.</span></div>
      <h5>Resultado observado na base</h5>
      <p>O agente contou apenas eventos fechados. Ficaram de fora eventos de Sobreposição, eventos Duplicados e eventos fechados há menos de 48h antes do corte de 31/10/2026 23:59:59. Cada site precisava ter pelo menos 5 eventos na conta.</p>
      <table class="rk"><thead><tr><th>#</th><th>Site</th><th>Regional</th><th>UF</th><th>Classe</th><th class="r">Reincidentes</th><th class="r">Eventos na conta</th><th class="r">Taxa N2</th></tr></thead><tbody>
        ${RANK.map((r, i) => `<tr><td class="n">${i + 1}</td><td><b>Site ${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td><span class="cl">${r[3]}</span></td><td class="r n">${r[4]}</td><td class="r n">${r[5]}</td>
          <td class="r"><span class="rate"><b>${pct(rate(r))}</b><i><em style="width:${(rate(r) / max) * 100}%"></em></i></span></td></tr>`).join("")}
      </tbody></table><p class="rk-foot">Top 10 por taxa de reincidência de nível 2 · reincidentes ÷ eventos na conta.</p>
      <h5>Padrões observados (associação, não causalidade)</h5>
      <ul>
        <li><b>Regionais:</b> entre os 30 primeiros sites, a TLESTE/RJ aparece mais (9 sites, média perto de 64%). Em seguida vêm TSUL e TCN, com 8 sites cada.</li>
        <li><b>Classe:</b> a Classe C domina, com 10 dos 15 primeiros. Sites Classe A também aparecem com taxas altas, como o Site 00500 e o Site 00360.</li>
        <li><b>Volume:</b> cada site do ranking tem dezenas de eventos na conta, então as taxas não vêm de amostras pequenas.</li>
      </ul>
      <div class="rec"><div class="rh">Recomendação · apoio à decisão do NOC</div>
        <h4>Investigar o Site ${top[0]} antes de qualquer novo despacho</h4>
        <div class="rr"><span>Site</span><b>Site ${top[0]} · ${top[1]}/${top[2]} · Classe ${top[3]}</b></div>
        <div class="rr"><span>Taxa N2</span><b>${pct(rate(top))} · ${top[4]} de ${top[5]} eventos</b></div>
        <div class="rr"><span>Ação do agente</span><b>Somente leitura, nada é executado nos sistemas</b></div>
        <ul class="why">
          <li><b>Site ${top[0]}:</b> verificar se há jornada de intermitência ativa, causa raiz não resolvida ou elemento crítico em estado degradado.</li>
          <li><b>Quatro sites da TLESTE/RJ entre os dez primeiros:</b> a concentração sugere causa comum, como infraestrutura compartilhada, um tipo de elemento ou um mesmo perfil de falha.</li>
          <li><b>Antes de despachar campo:</b> checar se há eventos abertos agora nesses sites e se tasks anteriores terminaram como Not Done ou como Done sem atuação técnica.</li>
        </ul>
        <p class="conf">As regras de quais eventos entram na conta e os limites de corte precisam ser validados com a TIM antes de uso operacional.</p></div>
      <p class="next"><b>Próxima pergunta sugerida:</b> “Monte o contexto do Site 00290: jornadas de intermitência, alarmes e tasks recentes.”</p></div>`;
  }

  function ask() {
    if (busy) return;
    busy = true; input.disabled = true; send.disabled = true; input.placeholder = "Use Reiniciar para começar um novo teste";
    const q = PROMPTS[0];
    msgs.querySelector(".sugg")?.remove();
    const u = document.createElement("div"); u.className = "umsg"; u.textContent = q; msgs.appendChild(u);
    const b = bot(`<div class="activity first" id="act"></div><div class="thinking" style="margin-top:10px"><span class="dots"><i></i><i></i><i></i></span><span id="tk">${THINK[0]}…</span></div>`);
    actEl = $("#act", b); bottom();
    CALLS.forEach((_, i) => later((i + 1) * 650, () => { shown = i + 1; const t = $("#tk", b); if (t) t.textContent = (THINK[i + 1] ?? "Montando a resposta") + "…"; drawActivity(); drawInsp(null); bottom(); }));
    later(CALLS.length * 650 + 500, () => {
      b.querySelector(".thinking").outerHTML = answerHtml();
      bottom();
    });
  }
  function reset() { timers.forEach(clearTimeout); timers = []; go("test"); }

  bot(`<p>Olá, eu sou o <b>${esc(AGENT.name)}</b>. Posso detectar reincidência e sobreposição de falhas, montar o contexto de um evento, de um elemento ou de um site e apoiar a decisão do NOC. Sou somente leitura: não executo ações nos sistemas operacionais. O que você quer analisar?</p>
    <div class="sugg">${PROMPTS.map((p, i) => `<button data-prompt="${i}" title="${i ? "Esta demo responde à pergunta sobre reincidência de nível 2 por site" : ""}">${esc(p)}</button>`).join("")}</div>`);
  $("#rs", c).onclick = reset;
  $("#cf", c).onsubmit = (e) => { e.preventDefault(); if (input.value.trim()) ask(); };
  drawInsp(null);
  if (qp.has("demo")) later(500, ask);
}

/* ============ Avaliação ============ */
function evaluation(c) {
  const R = EVAL_ROWS, r = R[st.evalSel];
  const pass = R.filter((x) => x.policy === "Pass").length;
  const avgG = R.reduce((a, x) => a + x.groundedness, 0) / R.length;
  const good = (o) => o === "Atingido" || o === "Parou corretamente";
  const achieved = R.filter((x) => good(x.outcome)).length;
  const expected = R.filter((x) => x.outcome !== "Sem ação esperada").length;
  const meter = (v) => `<span class="meter"><b>${v.toFixed(2).replace(".", ",")}</b><i><em style="width:${v * 100}%;background:${v >= 0.9 ? "#107c10" : v >= 0.85 ? "#c19c00" : "#c50f1f"}"></em></i></span>`;
  const cls = (o) => (good(o) ? "ok" : o === "Pendente" ? "warn" : o === "Sem ação esperada" ? "na" : "bad");
  c.innerHTML = `<div class="eval"><div class="dims">
    <div class="dim"><div class="dt"><img src="${IMG.cel}" alt="" class="cw sm">Conformidade com as regras</div><b>${pass} de ${R.length}</b><p>Respostas que respeitaram as regras configuradas: exclusões da reincidência, corte de 31/10/2026, somente leitura e sem valores financeiros.</p><span class="dsrc">Verificações de regra no Context Model da Celonis</span></div>
    <div class="dim"><div class="dt">${I.spark}Qualidade da resposta</div><b>${avgG.toFixed(2).replace(".", ",")} <em>fundamentação</em></b><p>Respostas sustentadas pelas saídas das ferramentas, com os resultados interpretados corretamente.</p><span class="dsrc">Avaliadores do Microsoft Foundry</span></div>
    <div class="dim"><div class="dt">${I.process}Resultado de negócio</div><b>${achieved} de ${expected} <em>com ação esperada</em></b><p>Se a recomendação apoiou a decisão do NOC e o fluxo chegou ao estado pretendido.</p><span class="dsrc">Dados de processo e revisão humana</span></div></div>
    <p class="evnote">As três dimensões são reportadas separadamente. Elas não são combinadas em uma nota única, e nenhuma é a probabilidade de a resposta estar correta.</p>
    <div class="card wide"><div class="sh"><div><h3>Execuções de avaliação</h3><p>Conjunto de teste · reincidência e contexto da Operação de Rede · execução de 06/11/2026, 08:30</p></div><button class="btn sm pri" id="rn">Executar avaliação</button></div>
      <table class="et"><thead><tr><th>Cenário</th><th>Conformidade<i>Celonis</i></th><th>Fundamentação<i>Foundry</i></th><th>Uso de ferramentas<i>Foundry</i></th><th>Resultado de negócio<i>Dados de processo · revisão</i></th></tr></thead>
      <tbody>${R.map((x, i) => `<tr data-r="${i}" class="${st.evalSel === i ? "on" : ""}"><td>${x.scenario}</td><td><span class="st ${x.policy === "Pass" ? "ok" : "bad"}">${x.policy === "Pass" ? "Aprovado" : "Reprovado"}</span></td><td>${meter(x.groundedness)}</td><td>${meter(x.toolUse)}</td><td><span class="st ${cls(x.outcome)}">${x.outcome}</span></td></tr>`).join("")}</tbody></table>
      <div class="edetail"><h4>${r.scenario}</h4><div class="eg">
        <div><span>Conformidade</span><b>${r.policy === "Pass" ? "Aprovado" : "Reprovado"}</b><p>${r.policyNote}</p></div>
        <div><span>Qualidade da resposta</span><b>${r.groundedness.toFixed(2).replace(".", ",")} fundamentação · ${(r.toolUse * 100).toFixed(0)}% uso de ferramentas</b><p>${r.groundedness >= 0.9 ? "Todo número da resposta foi rastreado até um resultado de ferramenta." : "Um número da resposta não pôde ser rastreado até um resultado de ferramenta."}</p></div>
        <div><span>Resultado de negócio</span><b>${r.outcome}</b><p>${r.outcomeNote}</p></div></div></div></div>
    <p class="disc">Avaliação de amostra, apenas ilustrativa. Fundamentação e uso de ferramentas estão numa escala de 0 a 1 por execução.</p></div>`;
  c.querySelectorAll("tr[data-r]").forEach((tr) => (tr.onclick = () => { st.evalSel = +tr.dataset.r; evaluation(c); }));
  const rn = $("#rn", c);
  rn.onclick = () => { rn.disabled = true; rn.textContent = "Executando…"; setTimeout(() => { if (rn.isConnected) { rn.disabled = false; rn.textContent = "Executar avaliação"; } }, 1600); };
}

shell();
go(tab);
</script>
</body>
</html>
